name: Tests Linux

on:
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: Publish NuGet packages after validation
        required: false
        type: boolean
        default: false
      publish_hub:
        description: Publish Lakona Hub after NuGet succeeds
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tests-linux.yml"
      - ".github/workflows/publish-hub.yml"
      - ".githooks/**"
      - ".agents/skills/lakona-e2e-testing/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
      - "scripts/git/**"
      - "scripts/hub/**"
      - "scripts/test.ps1"
      - "src/**"
      - "tests/**"
      - "samples/Game.Cluster.TwoNode/**"
  pull_request:
    paths:
      - ".github/workflows/tests-linux.yml"
      - ".github/workflows/publish-hub.yml"
      - ".githooks/**"
      - ".agents/skills/lakona-e2e-testing/**"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
      - "scripts/git/**"
      - "scripts/hub/**"
      - "scripts/test.ps1"
      - "src/**"
      - "tests/**"
      - "samples/Game.Cluster.TwoNode/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      nuget_required: ${{ steps.release_scope.outputs.nuget_required }}
      hub_required: ${{ steps.release_scope.outputs.hub_required }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release scope
        id: release_scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
          DISPATCH_NUGET: ${{ inputs.publish_nuget || false }}
          DISPATCH_HUB: ${{ inputs.publish_hub || false }}
        run: |
          set -euo pipefail
          nuget_required=false
          hub_required=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_NUGET" == "true" || "$DISPATCH_HUB" == "true" ]]; then
              if [[ "$REF_NAME" != "refs/heads/main" ]]; then
                echo "::error::Releases must be dispatched from main."
                exit 1
              fi
              nuget_required=true
            fi
            if [[ "$DISPATCH_HUB" == "true" ]]; then
              hub_required=true
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            changed_paths="$(mktemp)"
            if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] &&
               git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$changed_paths"
            else
              git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > "$changed_paths"
            fi

            while IFS= read -r path; do
              case "$path" in
                src/*|Directory.Build.props|Directory.Build.targets|global.json)
                  nuget_required=true
                  ;;
              esac
              case "$path" in
                src/Lakona.Hub/*|src/Lakona.ProjectSystem/*|scripts/hub/*|Directory.Build.props|Directory.Build.targets|global.json|.github/workflows/tests-linux.yml|.github/workflows/publish-hub.yml)
                  hub_required=true
                  nuget_required=true
                  ;;
              esac
            done < "$changed_paths"
            rm -f "$changed_paths"
          fi

          echo "nuget_required=$nuget_required" >> "$GITHUB_OUTPUT"
          echo "hub_required=$hub_required" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Inspect workspace
        run: |
          pwd
          find src tests -maxdepth 2 -name "*.csproj" -print

      - name: Restore
        run: dotnet restore Lakona.slnx

      - name: Build
        run: dotnet build Lakona.slnx --no-restore -c Release -m:1 /nr:false /p:UseSharedCompilation=false

      - name: Test projects
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            echo "==> dotnet test $project"
            dotnet test "$project" --no-build -c Release -m:1 /nr:false /p:UseSharedCompilation=false --blame-hang --blame-hang-timeout 120s
          done < <(find tests -name "*.csproj" -print | sort)

      - name: Pack NuGet packages
        if: steps.release_scope.outputs.nuget_required == 'true'
        run: |
          set -euo pipefail
          rm -rf artifacts/nuget
          mkdir -p artifacts/nuget
          while IFS= read -r project; do
            echo "==> dotnet pack $project"
            dotnet pack "$project" --no-build --no-restore -c Release -o artifacts/nuget
          done < <(find src -maxdepth 2 -name "*.csproj" -print | sort)

      - name: Upload NuGet packages
        if: steps.release_scope.outputs.nuget_required == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/nuget
          if-no-files-found: error
          retention-days: 2

  publish-nuget:
    needs: tests
    if: needs.tests.outputs.nuget_required == 'true'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: publish-nuget
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages-${{ github.sha }}
          path: artifacts/nuget

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER || vars.NUGET_USER }}

      - name: Push NuGet packages
        run: |
          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

  publish-hub:
    needs: [tests, publish-nuget]
    if: needs.tests.outputs.hub_required == 'true' && needs.publish-nuget.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-hub.yml
    secrets: inherit
