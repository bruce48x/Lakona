name: Publish Lakona Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-hub.yml"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
      - "scripts/hub/**"
      - "src/Lakona.Hub/**"
      - "src/Lakona.ProjectSystem/**"

concurrency:
  group: publish-lakona-hub
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SDK_VERSION: 10.0.100

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true

      - name: Resolve version from project
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Lakona Hub releases must be published from main.'
          }
          $node = Select-Xml -Path 'src/Lakona.Hub/Lakona.Hub.csproj' -XPath '/Project/PropertyGroup/Version' |
            Select-Object -First 1
          if ($null -eq $node) {
            throw 'Lakona.Hub.csproj does not declare a Version.'
          }
          $version = $node.Node.InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid Hub version in Lakona.Hub.csproj: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=hub-v$version" >> $env:GITHUB_OUTPUT

      - name: Reject an already-published version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Lakona Hub ${{ steps.version.outputs.value }} is already published. Bump src/Lakona.Hub/Lakona.Hub.csproj before publishing again."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test Hub
        run: dotnet test tests/Lakona.Hub.Tests/Lakona.Hub.Tests.csproj -c Release -m:1 /nr:false /p:UseSharedCompilation=false

      - name: Check Hub version
        run: dotnet test tests/Lakona.RepositoryGuards.Tests/Lakona.RepositoryGuards.Tests.csproj -c Release -m:1 /nr:false /p:UseSharedCompilation=false --filter HubVersion

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runs_on: windows-latest
            sdk_os: win
            sdk_arch: x64
          - rid: linux-x64
            runs_on: ubuntu-22.04
            sdk_os: linux
            sdk_arch: x64
          - rid: osx-x64
            runs_on: macos-15-intel
            sdk_os: osx
            sdk_arch: x64
          - rid: osx-arm64
            runs_on: macos-15
            sdk_os: osx
            sdk_arch: arm64
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Linux NativeAOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev xvfb xauth

      - name: Publish NativeAOT app with analysis warnings as errors
        shell: pwsh
        run: >-
          dotnet publish src/Lakona.Hub/Lakona.Hub.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o artifacts/publish/hub-${{ matrix.rid }}
          -p:Version=${{ needs.validate.outputs.version }}
          -p:TreatWarningsAsErrors=true
          -p:ILLinkTreatWarningsAsErrors=true
          -p:SuppressTrimAnalysisWarnings=false
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Remove debug symbols
        shell: pwsh
        run: Get-ChildItem 'artifacts/publish/hub-${{ matrix.rid }}' -Recurse -Filter '*.pdb' | Remove-Item -Force

      - name: Add private .NET 10 SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 `
            -Version $env:DOTNET_SDK_VERSION `
            -Architecture '${{ matrix.sdk_arch }}' `
            -InstallDir 'artifacts/publish/hub-${{ matrix.rid }}/dotnet' `
            -NoPath

      - name: Add private .NET 10 SDK on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh \
            --version "$DOTNET_SDK_VERSION" \
            --os "${{ matrix.sdk_os }}" \
            --architecture "${{ matrix.sdk_arch }}" \
            --install-dir "artifacts/publish/hub-${{ matrix.rid }}/dotnet" \
            --no-path

      - name: Smoke test Windows NativeAOT artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: "& 'artifacts/publish/hub-${{ matrix.rid }}/Lakona.Hub.exe' --aot-smoke-test"

      - name: Smoke test Linux NativeAOT artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x artifacts/publish/hub-${{ matrix.rid }}/Lakona.Hub
          chmod +x artifacts/publish/hub-${{ matrix.rid }}/dotnet/dotnet
          xvfb-run --auto-servernum artifacts/publish/hub-${{ matrix.rid }}/Lakona.Hub --aot-smoke-test

      - name: Smoke test macOS NativeAOT artifact
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x artifacts/publish/hub-${{ matrix.rid }}/Lakona.Hub
          chmod +x artifacts/publish/hub-${{ matrix.rid }}/dotnet/dotnet
          artifacts/publish/hub-${{ matrix.rid }}/Lakona.Hub --aot-smoke-test

      - name: Install pinned WiX Toolset
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./scripts/hub/New-HubWindowsPackage.ps1
          -Version '${{ needs.validate.outputs.version }}'
          -PublishRoot artifacts/publish/hub-${{ matrix.rid }}
          -OutputRoot artifacts/packages/hub-${{ matrix.rid }}

      - name: Smoke test Windows MSI payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = Resolve-Path 'artifacts/packages/hub-${{ matrix.rid }}/lakona-hub-${{ needs.validate.outputs.version }}-${{ matrix.rid }}.msi'
          $extract = Join-Path $PWD 'artifacts/msi-extract'
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          $process = Start-Process msiexec.exe `
            -ArgumentList @('/a', $package.Path, '/qn', '/norestart', "TARGETDIR=$extract") `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) { throw "MSI administrative extraction failed with exit code $($process.ExitCode)." }
          $executable = Get-ChildItem $extract -Recurse -Filter 'Lakona.Hub.exe' |
            Where-Object { $_.FullName -notmatch '[\\/]dotnet[\\/]' } |
            Select-Object -First 1
          if ($null -eq $executable) { throw 'The MSI does not contain Lakona.Hub.exe.' }
          $smoke = Start-Process $executable.FullName -ArgumentList '--aot-smoke-test' -Wait -PassThru
          if ($smoke.ExitCode -ne 0) { throw 'The extracted MSI payload failed its smoke test.' }

      - name: Build macOS DMG
        if: runner.os == 'macOS'
        shell: pwsh
        run: >-
          ./scripts/hub/New-HubMacPackage.ps1
          -Version '${{ needs.validate.outputs.version }}'
          -Rid '${{ matrix.rid }}'
          -PublishRoot artifacts/publish/hub-${{ matrix.rid }}
          -OutputRoot artifacts/packages/hub-${{ matrix.rid }}

      - name: Smoke test macOS DMG payload
        if: runner.os == 'macOS'
        shell: pwsh
        run: |
          $package = Resolve-Path 'artifacts/packages/hub-${{ matrix.rid }}/lakona-hub-${{ needs.validate.outputs.version }}-${{ matrix.rid }}.dmg'
          $mount = Join-Path $PWD 'artifacts/dmg-mount'
          New-Item -ItemType Directory -Path $mount -Force | Out-Null
          & hdiutil attach $package -mountpoint $mount -nobrowse -readonly
          if ($LASTEXITCODE -ne 0) { throw 'Could not mount the generated DMG.' }
          try {
            & (Join-Path $mount 'Lakona Hub.app/Contents/MacOS/Lakona.Hub') --aot-smoke-test
            if ($LASTEXITCODE -ne 0) { throw 'The mounted DMG payload failed its smoke test.' }
          }
          finally {
            & hdiutil detach $mount
          }

      - name: Upload installer package
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: hub-${{ matrix.rid }}-package
          path: artifacts/packages/hub-${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 2

      - name: Upload Linux platform files
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: hub-${{ matrix.rid }}
          path: artifacts/publish/hub-${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 2

  package-linux:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Download Linux publish files
        uses: actions/download-artifact@v8
        with:
          name: hub-linux-x64
          path: artifacts/publish/hub-linux-x64

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache: false

      - name: Install pinned nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build DEB and RPM packages
        shell: pwsh
        run: >-
          ./scripts/hub/New-HubLinuxPackages.ps1
          -Version '${{ needs.validate.outputs.version }}'
          -PublishRoot artifacts/publish/hub-linux-x64
          -OutputRoot artifacts/publish/hub-linux-packages

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: hub-linux-packages
          path: artifacts/publish/hub-linux-packages
          if-no-files-found: error
          retention-days: 2

  release:
    needs: [validate, build, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Download platform files
        uses: actions/download-artifact@v8
        with:
          pattern: hub-*
          path: artifacts/publish

      - name: Build release manifest
        shell: pwsh
        run: |
          $parameters = @{
            Version = '${{ needs.validate.outputs.version }}'
            Tag = '${{ needs.validate.outputs.tag }}'
            Repository = '${{ github.repository }}'
            PublishRoot = 'artifacts/publish'
            OutputRoot = 'artifacts/release'
          }
          ./scripts/hub/New-HubRelease.ps1 @parameters

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.validate.outputs.tag }}'
          gh release create "$tag" artifacts/release/* \
            --target '${{ github.sha }}' \
            --title "Lakona Hub ${{ needs.validate.outputs.version }}" \
            --generate-notes
