name: Publish Lakona Hub

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-hub.yml"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "global.json"
      - "scripts/hub/**"
      - "src/Lakona.Hub/**"
      - "src/Lakona.ProjectSystem/**"

concurrency:
  group: publish-lakona-hub
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DOTNET_SDK_VERSION: 10.0.100

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version from project
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref }}' -ne 'refs/heads/main') {
            throw 'Lakona Hub releases must be published from main.'
          }
          $node = Select-Xml -Path 'src/Lakona.Hub/Lakona.Hub.csproj' -XPath '/Project/PropertyGroup/Version' |
            Select-Object -First 1
          if ($null -eq $node) {
            throw 'Lakona.Hub.csproj does not declare a Version.'
          }
          $version = $node.Node.InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid Hub version in Lakona.Hub.csproj: $version"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=hub-v$version" >> $env:GITHUB_OUTPUT

      - name: Reject an already-published version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ steps.version.outputs.tag }}'
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1 || gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Lakona Hub ${{ steps.version.outputs.value }} is already published. Bump src/Lakona.Hub/Lakona.Hub.csproj before publishing again."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Test Hub
        run: dotnet test tests/Lakona.Hub.Tests/Lakona.Hub.Tests.csproj -c Release -m:1 /nr:false /p:UseSharedCompilation=false

      - name: Check Hub version
        run: dotnet test tests/Lakona.RepositoryGuards.Tests/Lakona.RepositoryGuards.Tests.csproj -c Release -m:1 /nr:false /p:UseSharedCompilation=false --filter HubVersion

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            sdk_os: win
            sdk_arch: x64
          - rid: linux-x64
            sdk_os: linux
            sdk_arch: x64
          - rid: osx-x64
            sdk_os: osx
            sdk_arch: x64
          - rid: osx-arm64
            sdk_os: osx
            sdk_arch: arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained app
        run: >-
          dotnet publish src/Lakona.Hub/Lakona.Hub.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -o artifacts/publish/hub-${{ matrix.rid }}
          -p:Version=${{ needs.validate.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Add private .NET 10 SDK
        shell: bash
        run: |
          set -euo pipefail
          find "artifacts/publish/hub-${{ matrix.rid }}" -type f -name '*.pdb' -delete
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          bash dotnet-install.sh \
            --version "$DOTNET_SDK_VERSION" \
            --os "${{ matrix.sdk_os }}" \
            --architecture "${{ matrix.sdk_arch }}" \
            --install-dir "artifacts/publish/hub-${{ matrix.rid }}/dotnet" \
            --no-path

      - name: Upload platform files
        uses: actions/upload-artifact@v7
        with:
          name: hub-${{ matrix.rid }}
          path: artifacts/publish/hub-${{ matrix.rid }}
          if-no-files-found: error
          retention-days: 2

  package-linux:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Linux publish files
        uses: actions/download-artifact@v8
        with:
          name: hub-linux-x64
          path: artifacts/publish/hub-linux-x64

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.x
          cache: false

      - name: Install pinned nFPM
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0

      - name: Build DEB and RPM packages
        shell: pwsh
        run: >-
          ./scripts/hub/New-HubLinuxPackages.ps1
          -Version '${{ needs.validate.outputs.version }}'
          -PublishRoot artifacts/publish/hub-linux-x64
          -OutputRoot artifacts/publish/hub-linux-packages

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: hub-linux-packages
          path: artifacts/publish/hub-linux-packages
          if-no-files-found: error
          retention-days: 2

  release:
    needs: [validate, build, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download platform files
        uses: actions/download-artifact@v8
        with:
          pattern: hub-*
          path: artifacts/publish

      - name: Download previous Hub release
        id: previous
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentTag = '${{ needs.validate.outputs.tag }}'
          $releases = gh release list --limit 100 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          $previous = $releases |
            Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName.StartsWith('hub-v') -and $_.tagName -ne $currentTag } |
            Select-Object -First 1
          if ($null -eq $previous) {
            'found=false' >> $env:GITHUB_OUTPUT
            exit 0
          }
          New-Item -ItemType Directory -Path artifacts/previous -Force | Out-Null
          gh release download $previous.tagName --pattern 'lakona-hub-manifest.json' --dir artifacts/previous
          gh release download $previous.tagName --pattern 'lakona-hub-*-win-x64.zip' --dir artifacts/previous
          gh release download $previous.tagName --pattern 'lakona-hub-*-osx-x64.zip' --dir artifacts/previous
          gh release download $previous.tagName --pattern 'lakona-hub-*-osx-arm64.zip' --dir artifacts/previous
          'found=true' >> $env:GITHUB_OUTPUT

      - name: Build full and incremental release assets
        shell: pwsh
        run: |
          $parameters = @{
            Version = '${{ needs.validate.outputs.version }}'
            Tag = '${{ needs.validate.outputs.tag }}'
            Repository = '${{ github.repository }}'
            PublishRoot = 'artifacts/publish'
            OutputRoot = 'artifacts/release'
          }
          if ('${{ steps.previous.outputs.found }}' -eq 'true') {
            $parameters.PreviousRoot = 'artifacts/previous'
          }
          ./scripts/hub/New-HubRelease.ps1 @parameters

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='${{ needs.validate.outputs.tag }}'
          gh release create "$tag" artifacts/release/* \
            --target '${{ github.sha }}' \
            --title "Lakona Hub ${{ needs.validate.outputs.version }}" \
            --generate-notes
