name: Docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "blog/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/rpc/check-docs-consistency.ps1"
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "blog/**"
      - "docs/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "scripts/rpc/check-docs-consistency.ps1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: blog/package-lock.json

      - name: Install blog dependencies
        working-directory: blog
        run: |
          npm ci
          npm exec -- hugo version

      - name: Check docs consistency
        run: pwsh -NoProfile -File scripts/rpc/check-docs-consistency.ps1

      - name: Build Hugo site
        working-directory: blog
        run: |
          npm run build
          test -d public
          ls -la public

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./blog/public

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: docs

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
