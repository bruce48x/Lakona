name: lakona-hub
arch: amd64
platform: linux
version: ${HUB_VERSION}
release: 1
section: devel
priority: optional
maintainer: Lakona Contributors <bruce48x@users.noreply.github.com>
description: Lakona project creation and local development hub
vendor: Lakona
homepage: https://github.com/bruce48x/Lakona
license: MIT
contents:
  - src: ${HUB_PUBLISH_ROOT}/
    dst: /usr/lib/lakona-hub
    type: tree
    expand: true
  - src: scripts/hub/linux/dev.lakona.hub.desktop
    dst: /usr/share/applications/dev.lakona.hub.desktop
    file_info:
      mode: 0644
  - src: /usr/lib/lakona-hub/Lakona.Hub
    dst: /usr/bin/lakona-hub
    type: symlink
overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libssl3
      - libicu70 | libicu72 | libicu74 | libicu76
      - libx11-6
      - libice6
      - libsm6
      - libfontconfig1
      - xdg-utils
  rpm:
    depends:
      - glibc
      - libgcc
      - libstdc++
      - zlib
      - openssl-libs
      - libicu
      - libX11
      - libICE
      - libSM
      - fontconfig
      - xdg-utils
