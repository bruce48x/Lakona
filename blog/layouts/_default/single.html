{{ define "main" }}
  <div class="wrap article-shell">
    <article class="article">
      <header class="article-header">
        {{ if eq .Section "posts" }}<a class="article-back" href="{{ "posts/" | relURL }}">← All guides</a>{{ end }}
        <h1>{{ .Title }}</h1>
      </header>
      <div class="content">
        {{ .Content }}
      </div>
    </article>
  </div>
{{ end }}
