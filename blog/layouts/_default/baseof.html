<!doctype html>
<html lang="{{ .Site.Language.Lang | default "en-us" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b0a">
    <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
    <meta name="description" content="{{ with .Params.description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  </head>
  <body>
    <header class="site-header" id="site-header">
      <div class="wrap">
        <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="Lakona home">
          <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v13h12"/><circle cx="6" cy="4" r="2" fill="var(--bg)"/><circle cx="6" cy="18" r="2" fill="var(--bg)"/><circle cx="19" cy="18" r="2" fill="var(--bg)"/></svg>
          <span>{{ .Site.Title }}</span>
        </a>
        <nav class="nav" aria-label="Primary navigation">
          <a href="{{ "posts/" | relURL }}">Guides</a>
          <a href="{{ "about/" | relURL }}">About</a>
          <a class="nav-github" href="{{ .Site.Params.repo }}" target="_blank" rel="noopener" aria-label="Lakona on GitHub">
            <span>GitHub</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg>
          </a>
        </nav>
      </div>
    </header>
    <main>{{ block "main" . }}{{ end }}</main>
    <footer class="site-footer">
      <div class="wrap">
        <div class="footer-identity">
          <a class="brand" href="{{ .Site.Home.RelPermalink }}">
            <svg class="brand-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 5v13h12"/><circle cx="6" cy="4" r="2" fill="var(--bg)"/><circle cx="6" cy="18" r="2" fill="var(--bg)"/><circle cx="19" cy="18" r="2" fill="var(--bg)"/></svg>
            <span>{{ .Site.Title }}</span>
          </a>
          <p class="muted">Open source &middot; MIT License</p>
        </div>
        <div class="footer-links">
          <a href="{{ .Site.Params.repo }}" target="_blank" rel="noopener">GitHub</a>
          <a href="{{ "about/" | relURL }}">About</a>
        </div>
      </div>
    </footer>
    <script>
      document.documentElement.classList.add('js');

      // Sticky header scroll effect
      const header = document.getElementById('site-header');
      window.addEventListener('scroll', () => {
        header.classList.toggle('scrolled', window.scrollY > 20);
      });

      // Scroll-triggered fade-in animations
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
          }
        });
      }, { threshold: 0.15 });

      document.querySelectorAll('.feature-card, .guide-card, .code-window').forEach(el => {
        observer.observe(el);
      });

      // Copy buttons for shell command blocks.
      async function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }

      document.querySelectorAll('.command-card pre code, .engine-card pre code').forEach(code => {
        const block = code.closest('.command-card, .engine-card');
        if (!block || block.querySelector('.copy-button')) {
          return;
        }

        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'copy-button';
        button.textContent = 'Copy';
        button.setAttribute('aria-label', 'Copy command');

        button.addEventListener('click', async () => {
          const original = button.textContent;
          try {
            await copyText(code.textContent.trim());
            button.textContent = 'Copied';
          } catch {
            button.textContent = 'Failed';
          }

          window.setTimeout(() => {
            button.textContent = original;
          }, 1400);
        });

        block.appendChild(button);
      });
    </script>
  </body>
</html>
