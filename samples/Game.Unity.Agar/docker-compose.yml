services:
  data-1:
    build:
      context: ../..
      dockerfile: samples/Game.Unity.Agar/Server/Dockerfile
      target: gateway
    container_name: lakona-agar-data-1
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: data-1
      ConnectionStrings__LakonaClusterPostgres: Host=postgres;Port=5432;Database=${LAKONA_CLUSTER_POSTGRES_DB:-lakona-game};Username=${LAKONA_CLUSTER_POSTGRES_USER:-lakona-game};Password=${LAKONA_CLUSTER_POSTGRES_PASSWORD:-lakona-game_dev_password}
      ConnectionStrings__AgarGamePostgres: Host=postgres;Port=5432;Database=${AGAR_POSTGRES_DB:-agar-game};Username=${AGAR_POSTGRES_USER:-agar};Password=${AGAR_POSTGRES_PASSWORD:-agar_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      agar-cluster:
        ipv4_address: 10.0.0.1

  gateway-1:
    build:
      context: ../..
      dockerfile: samples/Game.Unity.Agar/Server/Dockerfile
      target: gateway
    container_name: lakona-agar-gateway-1
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: gateway-1
    depends_on:
      data-1:
        condition: service_started
    ports:
      - "${AGAR_GATEWAY_PORT:-20000}:20000"
    networks:
      agar-cluster:
        ipv4_address: 10.0.0.2

  battle-1:
    build:
      context: ../..
      dockerfile: samples/Game.Unity.Agar/Server/Dockerfile
      target: gateway
    container_name: lakona-agar-battle-1
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: battle-1
    depends_on:
      data-1:
        condition: service_started
    ports:
      - "${AGAR_BATTLE_PORT:-20001}:20001/udp"
    networks:
      agar-cluster:
        ipv4_address: 10.0.0.3

  postgres:
    image: postgres:18-alpine
    container_name: lakona-game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lakona-game}
      POSTGRES_USER: ${POSTGRES_USER:-lakona-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakona-game_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakona-game} -d ${POSTGRES_DB:-lakona-game}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agar-cluster

  redis:
    image: redis:7-alpine
    container_name: lakona-game-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-lakona-game_redis_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-lakona-game_redis_dev_password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agar-cluster

volumes:
  postgres-data:
  redis-data:

networks:
  agar-cluster:
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.254
          ip_range: 10.0.0.128/25
