services:
  data-1:
    build:
      context: ../..
      dockerfile: samples/Game.Unity.Agar/Server/Dockerfile
      target: gateway
    container_name: lakona-agar-data-1
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: data-1
      Lakona__Node__Id: data-1
      Lakona__ActorHosts: '["user","matchmaking","leaderboard"]'
      Lakona__Cluster__Endpoint: tcp://10.0.0.1:21001
      Lakona__Cluster__BootstrapNewCluster: "true"
      Lakona__Cluster__Seeds: '[]'
      Lakona__Hotfix__DebugWatcher: "On"
      Lakona__Management__Http__Host: 0.0.0.0
      Lakona__Health__Enabled: "true"
      Lakona__Health__RequireLoopback: "false"
      Agar__Persistence__Postgres__ConnectionStringName: AgarGamePostgres
      Agar__Persistence__Redis__ConnectionStringName: AgarGameRedis
      ConnectionStrings__AgarGamePostgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lakona-game};Username=${POSTGRES_USER:-lakona-game};Password=${POSTGRES_PASSWORD:-lakona-game_dev_password}
      ConnectionStrings__AgarGameRedis: redis:6379,password=${REDIS_PASSWORD:-lakona-game_redis_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AGAR_DATA_MANAGEMENT_PORT:-20081}:20080"
    networks:
      agar-cluster:
        ipv4_address: 10.0.0.1

  gateway-1:
    build:
      context: ../..
      dockerfile: samples/Game.Unity.Agar/Server/Dockerfile
      target: gateway
    container_name: lakona-agar-gateway-1
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: gateway-1
      Lakona__Node__Id: gateway-1
      Lakona__Hotfix__DebugWatcher: "On"
      Lakona__ActorHosts: '[]'
      Lakona__Endpoints: >-
        [
          {
            "Transport": "websocket",
            "Serializer": "memorypack",
            "Host": "0.0.0.0",
            "AdvertisedHost": "gateway-1",
            "Port": 20000,
            "Path": "/ws",
            "ReliablePush": true,
            "RpcServices": [ "login", "player" ]
          }
        ]
      Lakona__Cluster__Endpoint: tcp://10.0.0.2:21002
      Lakona__Cluster__Seeds: '["tcp://10.0.0.1:21001","tcp://10.0.0.3:21003"]'
      Lakona__Management__Http__Host: 0.0.0.0
      Lakona__Health__Enabled: "true"
      Lakona__Health__RequireLoopback: "false"
      Agar__Persistence__Postgres__ConnectionStringName: AgarGamePostgres
      Agar__Persistence__Redis__ConnectionStringName: AgarGameRedis
      ConnectionStrings__AgarGamePostgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lakona-game};Username=${POSTGRES_USER:-lakona-game};Password=${POSTGRES_PASSWORD:-lakona-game_dev_password}
      ConnectionStrings__AgarGameRedis: redis:6379,password=${REDIS_PASSWORD:-lakona-game_redis_dev_password}
    depends_on:
      data-1:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AGAR_GATEWAY_PORT:-20000}:20000"
      - "${AGAR_GATEWAY_MANAGEMENT_PORT:-20080}:20080"
    networks:
      agar-cluster:
        ipv4_address: 10.0.0.2

  battle-1:
    build:
      context: ../..
      dockerfile: samples/Game.Unity.Agar/Server/Dockerfile
      target: gateway
    container_name: lakona-agar-battle-1
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: battle-1
      Lakona__Node__Id: battle-1
      Lakona__Hotfix__DebugWatcher: "On"
      Lakona__ActorHosts: '["room"]'
      Lakona__Endpoints: >-
        [
          {
            "Transport": "kcp",
            "Serializer": "memorypack",
            "Host": "0.0.0.0",
            "AdvertisedHost": "${AGAR_BATTLE_ADVERTISED_HOST:-127.0.0.1}",
            "Port": 20001,
            "ReliablePush": false,
            "RpcServices": [ "battle" ]
          }
        ]
      Lakona__Cluster__Endpoint: tcp://10.0.0.3:21003
      Lakona__Cluster__Seeds: '["tcp://10.0.0.1:21001","tcp://10.0.0.2:21002"]'
      Lakona__Management__Http__Host: 0.0.0.0
      Lakona__Health__Enabled: "true"
      Lakona__Health__RequireLoopback: "false"
      Agar__Persistence__Postgres__ConnectionStringName: AgarGamePostgres
      Agar__Persistence__Redis__ConnectionStringName: AgarGameRedis
      ConnectionStrings__AgarGamePostgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lakona-game};Username=${POSTGRES_USER:-lakona-game};Password=${POSTGRES_PASSWORD:-lakona-game_dev_password}
      ConnectionStrings__AgarGameRedis: redis:6379,password=${REDIS_PASSWORD:-lakona-game_redis_dev_password}
    depends_on:
      data-1:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AGAR_BATTLE_PORT:-20001}:20001/udp"
      - "${AGAR_BATTLE_MANAGEMENT_PORT:-20082}:20080"
    networks:
      agar-cluster:
        ipv4_address: 10.0.0.3

  postgres:
    image: postgres:18-alpine
    container_name: lakona-game-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lakona-game}
      POSTGRES_USER: ${POSTGRES_USER:-lakona-game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakona-game_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakona-game} -d ${POSTGRES_DB:-lakona-game}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agar-cluster

  redis:
    image: redis:7-alpine
    container_name: lakona-game-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-lakona-game_redis_dev_password}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-lakona-game_redis_dev_password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agar-cluster

volumes:
  postgres-data:
  redis-data:

networks:
  agar-cluster:
    ipam:
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.254
          ip_range: 10.0.0.128/25
