<text text-anchor="middle" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#7a8399" ><tspan x="256" y="200">Open fresh transport</tspan><tspan x="256" y="212">and send opaque ticket</tspan></text>
