<text text-anchor="middle" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#7a8399" ><tspan x="256" y="432">Reserved establishment</tspan><tspan x="256" y="444">acknowledgement</tspan></text>
