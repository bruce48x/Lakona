<text text-anchor="start" font-family="'Instrument Serif', Georgia, serif" font-size="12" font-weight="400" fill="#2d3142" font-style="italic"><tspan x="80" y="920">Retry with bounded backoff and a fresh transport</tspan></text>
<line x1="40" y1="1000" x2="920" y2="1000" stroke="#d8d9de"/><text x="40" y="1024" font-family="'Geist Mono', Consolas, monospace" font-size="8" fill="#7a8399" letter-spacing="1.2">SEQUENCE · FAITHFUL REDRAW</text>
</svg>
