<text text-anchor="middle" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#7a8399" ><tspan x="256" y="144">Heartbeat or</tspan><tspan x="256" y="156">connection fails</tspan></text>
