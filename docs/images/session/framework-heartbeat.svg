<text text-anchor="middle" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#7a8399" ><tspan x="480" y="260">Validate endpoint</tspan><tspan x="480" y="272">identity, ticket, and</tspan><tspan x="480" y="284">deadline</tspan></text>
