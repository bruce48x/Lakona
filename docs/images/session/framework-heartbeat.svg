<rect x="368" y="648" width="220" height="28" rx="4" fill="#f5f5f5"/>
<text text-anchor="middle" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#7a8399" ><tspan x="480" y="664">Replay pending reliable</tspan><tspan x="480" y="676">notifications before live delivery</tspan></text>
<path d="M368,740 H144" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#framework-heartbeat-arrow)"/>
<rect x="184" y="704" width="148" height="28" rx="4" fill="#f5f5f5"/>
<text text-anchor="middle" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#7a8399" ><tspan x="256" y="720">Retryable transport or</tspan><tspan x="256" y="732">handshake failure</tspan></text>
<path d="M368,808 H144" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#framework-heartbeat-arrow)"/>
<rect x="192" y="760" width="132" height="40" rx="4" fill="#f5f5f5"/>
<text text-anchor="middle" font-family="'Geist Mono', Consolas, monospace" font-size="8" font-weight="400" fill="#7a8399" ><tspan x="256" y="780">StateLost,</tspan><tspan x="256" y="792">RefreshRequired, or</tspan><tspan x="256" y="804">Terminated</tspan></text>
