<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1052" role="img" aria-labelledby="framework-heartbeat-title framework-heartbeat-desc">
<title id="framework-heartbeat-title">Framework Heartbeat</title>
<desc id="framework-heartbeat-desc">Sequence showing 12 ordered messages among 4 participants for Framework Heartbeat, including all branch fragments and notes.</desc>
<defs>
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
