<text text-anchor="middle" font-family="'Geist', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2d3142" ><tspan x="368" y="88">same configured</tspan><tspan x="368" y="104">endpoint</tspan></text>
<rect x="516" y="64" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
<text text-anchor="middle" font-family="'Geist', 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#2d3142" ><tspan x="592" y="96">session registry</tspan></text>
